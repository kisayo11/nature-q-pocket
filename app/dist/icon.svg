<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="natureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b8058" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#natureGrad)" />
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Medical Cross with Nature leaf curve -->
  <g transform="translate(256, 256)">
    <!-- Vertical Cross bar -->
    <rect x="-38" y="-120" width="76" height="240" rx="38" fill="url(#crossGrad)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.2))" />
    <!-- Horizontal Cross bar -->
    <rect x="-120" y="-38" width="240" height="76" rx="38" fill="url(#crossGrad)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.2))" />
    
    <!-- Nature Leaf Accent in top-right -->
    <path d="M 38 -38 C 110 -110, 160 -100, 150 -10 C 140 80, 50 40, 38 -38 Z" fill="#4ade80" opacity="0.9" />
  </g>

  <!-- Hospital Text badge -->
  <text x="256" y="440" font-family="'Pretendard', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    NATURE
  </text>
</svg>
